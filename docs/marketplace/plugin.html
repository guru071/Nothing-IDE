<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nothing IDE Marketplace</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		font-family: -apple-system, Segoe UI, Roboto, sans-serif;
		background: #14141a;
		color: #e6e6ea;
		padding: 32px 16px 64px;
	}
	main { width: 100%; max-width: 640px; margin: 0 auto; }
	a.back {
		display: inline-block;
		color: #9a9aa5;
		text-decoration: none;
		font-size: 0.85rem;
		margin-bottom: 20px;
	}
	a.back:hover { color: #e6e6ea; }
	.header { display: flex; gap: 16px; align-items: flex-start; }
	.header img {
		width: 64px;
		height: 64px;
		border-radius: 12px;
		background: #2c2c36;
		flex-shrink: 0;
		object-fit: cover;
	}
	h1 { font-size: 1.4rem; margin: 0 0 4px; }
	.author { color: #9a9aa5; font-size: 0.9rem; }
	.author .verified { color: #6ee7a0; }
	.meta-row {
		display: flex;
		gap: 8px;
		flex-wrap: wrap;
		margin: 14px 0;
	}
	.badge {
		display: inline-block;
		font-size: 0.78rem;
		padding: 3px 10px;
		border-radius: 999px;
		background: #2c2c36;
		color: #9a9aa5;
	}
	.badge.paid { background: #3d2f00; color: #ffcc66; }
	.badge.free { background: #1a3d24; color: #6ee7a0; }
	.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
	.tag {
		font-size: 0.75rem;
		padding: 3px 9px;
		border-radius: 6px;
		background: #1c1c24;
		border: 1px solid #2c2c36;
		color: #9a9aa5;
	}
	.description { line-height: 1.6; font-size: 0.95rem; margin: 20px 0; white-space: pre-wrap; }
	.changelog {
		background: #1c1c24;
		border: 1px solid #2c2c36;
		border-radius: 10px;
		padding: 16px;
		font-size: 0.85rem;
		line-height: 1.6;
		white-space: pre-wrap;
		font-family: ui-monospace, "SF Mono", Consolas, monospace;
		max-height: 320px;
		overflow-y: auto;
	}
	h2 { font-size: 1rem; margin: 28px 0 10px; }
	a.download {
		display: inline-block;
		margin-top: 20px;
		background: #635bff;
		color: #fff;
		text-decoration: none;
		font-weight: 600;
		font-size: 0.95rem;
		padding: 12px 22px;
		border-radius: 8px;
	}
	.status { color: #9a9aa5; font-size: 0.9rem; padding: 40px 0; text-align: center; }
	.status.error { color: #ff8080; }
</style>
</head>
<body>
<main>
	<a class="back" href="index.html">&larr; Back to Marketplace</a>
	<div id="content"></div>
	<div id="status" class="status">Loading...</div>
</main>
<script>
const API_BASE = "https://nothing-ide-goatech-d3fa1ace.vercel.app";
const $content = document.getElementById("content");
const $status = document.getElementById("status");

function el(tag, className, text) {
	const node = document.createElement(tag);
	if (className) node.className = className;
	if (text !== undefined) node.textContent = text;
	return node;
}

function render(plugin) {
	const header = el("div", "header");

	const img = el("img");
	img.src = plugin.icon;
	img.alt = "";
	header.appendChild(img);

	const headerBody = document.createElement("div");
	headerBody.appendChild(el("h1", null, plugin.name));

	const author = el("div", "author");
	author.textContent = plugin.author + (plugin.author_verified ? " " : "");
	if (plugin.author_verified) {
		const check = el("span", "verified", "✓ verified");
		author.appendChild(check);
	}
	headerBody.appendChild(author);
	header.appendChild(headerBody);
	$content.appendChild(header);

	const metaRow = el("div", "meta-row");
	const isPaid = Number(plugin.price) > 0;
	const priceBadge = el("span", `badge ${isPaid ? "paid" : "free"}`,
		isPaid ? `${plugin.currencySymbol || "$"}${plugin.price}` : "Free");
	metaRow.appendChild(priceBadge);
	metaRow.appendChild(el("span", "badge", `v${plugin.version}`));
	metaRow.appendChild(el("span", "badge", plugin.license || "Unknown license"));
	metaRow.appendChild(el("span", "badge", `${plugin.downloads} downloads`));
	$content.appendChild(metaRow);

	if (plugin.keywords && plugin.keywords.length > 0) {
		const tags = el("div", "tags");
		for (const keyword of plugin.keywords) {
			tags.appendChild(el("span", "tag", keyword));
		}
		$content.appendChild(tags);
	}

	if (plugin.description) {
		$content.appendChild(el("div", "description", plugin.description));
	}

	if (plugin.changelogs) {
		$content.appendChild(el("h2", null, "Changelog"));
		$content.appendChild(el("div", "changelog", plugin.changelogs));
	}

	const download = el("a", "download", "Download");
	download.href = `${API_BASE}/api/plugin/download/${encodeURIComponent(plugin.id)}`;
	$content.appendChild(download);
}

async function load() {
	const id = new URLSearchParams(location.search).get("id");
	if (!id) {
		$status.textContent = "No plugin specified.";
		$status.className = "status error";
		return;
	}

	try {
		const res = await fetch(`${API_BASE}/api/plugin/${encodeURIComponent(id)}`);
		if (!res.ok) throw new Error(res.status === 404 ? "Plugin not found." : `HTTP ${res.status}`);
		const plugin = await res.json();
		render(plugin);
		$status.style.display = "none";
	} catch (err) {
		$status.textContent = err.message || "Could not load this plugin.";
		$status.className = "status error";
	}
}

load();
</script>
</body>
</html>
